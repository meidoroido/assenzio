}

 background-color: var(--color);

.link{

.main{

.theme-toggle {
all: unset;

top: 10px; right: 10px;

padding: 0.2em;

border: 1px dotted var(--link);
cursor: crosshair;

}
body.✿ .theme-toggle {

border-color: var(--link);
}

}

 <button id="theme-toggle" class="theme-toggle">dark theme</button>

   <script>
    /* === this is the script for the colour change! Put it before you close the </body> === */
    const btn = document.getElementById('theme-toggle');
    const saved = localStorage.getItem('theme');

    function setTheme(t) {
      document.body.classList.remove('❀','✿');
      document.body.classList.add(t);
      localStorage.setItem('theme', t);
      /* === here u can change the emoji or writing that appears on the button === */
     btn.textContent = t === '✿' ? '✿' : '❀';
    }

    if (saved === '❀' || saved === '✿') {
      setTheme(saved);
    } else {
      const dark = window.matchMedia('(prefers-color-scheme: ✿)').matches;
      setTheme(dark ? '✿' : '❀');
    }

    btn.addEventListener('click', () => {
      const current = document.body.classList.contains('✿') ? '✿' : '❀';
      setTheme(current === '✿' ? '❀' : '✿');
    });
  </script>
